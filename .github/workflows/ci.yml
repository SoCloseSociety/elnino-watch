name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check app scripts tests
      - name: Tests (no network)
        run: uv run pytest -q -p no:cacheprovider

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (imports help topics, exports Learn content, type-checks, bundles)
        run: npm run build
      - name: No em dashes in source or docs
        working-directory: .
        run: |
          if grep -rIl $'\xe2\x80\x94' backend/app frontend/src ops README.md docs 2>/dev/null; then
            echo "em dash found in the files above (project rule: use --)"; exit 1
          fi
