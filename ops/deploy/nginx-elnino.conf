# /etc/nginx/sites-available/elnino -- rendered by ops/deploy/first_setup.sh
# (__PORT__ and __SERVER_NAMES__ are filled in). certbot --nginx then adds the 443
# server + the http->https redirect to THIS file, so first_setup.sh never overwrites
# an existing copy (FORCE_NGINX=1 does, after a backup).
#
# Static files come straight from frontend/dist. index.html itself (and every SPA
# route) is proxied to the app so it carries the Content-Security-Policy with the
# sha256 of its inline script (app/security.py computes it from the built file).

limit_req_zone $binary_remote_addr zone=elnino_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=elnino_snap:10m rate=2r/s;

upstream elnino_app {
    server 127.0.0.1:__PORT__;
    keepalive 8;
}

server {
    listen 80;
    server_name __SERVER_NAMES__;
    # To add another host name later: extend server_name, then
    # certbot --nginx --expand -d <first-name> -d <new-name>

    root /opt/elnino/app/frontend/dist;
    server_tokens off;
    client_max_body_size 64k;
    limit_req_status 429;

    access_log /var/log/nginx/elnino.access.log;
    error_log  /var/log/nginx/elnino.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json
               image/svg+xml text/plain application/manifest+json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    # Hashed Vite bundles: cache forever (a new build = new file names).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Crawlers: robots.txt + sitemap.xml are generated by the app (backend/app/seo.py:
    # Sitemap line, the few crawlable JSON Dataset endpoints, lastmod from real data).
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://elnino_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Webcam snapshot proxy (fetches upstream on a cache miss): tighter limit.
    location ~ ^/api/webcams/[^/]+/snapshot$ {
        limit_req zone=elnino_snap burst=10 nodelay;
        proxy_pass http://elnino_app;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=elnino_api burst=40 nodelay;
        proxy_pass http://elnino_app;
        # admin POST /api/sources/verify runs every collector (each capped at 300 s)
        proxy_read_timeout 330s;
    }

    # index.html is never served as a static file: the app adds its CSP + no-cache.
    location = /index.html {
        limit_req zone=elnino_api burst=40 nodelay;
        proxy_pass http://elnino_app;
    }

    # Real files from dist (favicon, ...) directly, everything else = SPA route -> app.
    location / {
        try_files $uri @app;
    }

    location @app {
        limit_req zone=elnino_api burst=40 nodelay;
        proxy_pass http://elnino_app;
    }
}
